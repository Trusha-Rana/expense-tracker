# categories.yaml
# ================
# Defines all spending categories, their type (need/want/saving/income),
# display color, and keyword rules for rule-based categorization.
#
# HOW RULES WORK:
#   The categorizer scans each transaction's raw merchant name (lowercased).
#   If any keyword in a category's keyword list is found as a substring,
#   that category wins. Rules are evaluated in ORDER — put more specific
#   categories above generic ones to avoid false matches.
#
# ADDING A CATEGORY:
#   1. Add a block below with a unique name
#   2. Set spending_type: need | want | saving | income
#   3. Add keywords that appear in your statement merchant names
#   4. Run the app — new categories appear automatically in the UI

